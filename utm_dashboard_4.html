<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTM Sales Dashboard — Feb–Apr 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f3f0;
  --surface: #ffffff;
  --surface2: #f0eeeb;
  --border: #e2dfd9;
  --text: #1a1a1a;
  --muted: #7a7672;
  --radius: 10px;
  --radius-sm: 6px;

  --vf-color: #7c3aed;
  --f-color:  #0369a1;
  --m-color:  #0f766e;
  --s-color:  #b45309;
  --d-color:  #9f1239;

  --sangria-accent: #be185d;
  --hop-accent:     #92400e;
  --aay-accent:     #1d4ed8;
  --ar-accent:      #9a3412;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 13px;
}

.header {
  background: var(--surface);
  padding: 20px 28px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-end; justify-content: space-between;
}
.header-title {
  font-family: 'Playfair Display', serif;
  font-size: 24px; font-weight: 700; color: var(--text);
}
.header-sub {
  color: var(--muted); font-size: 11px;
  font-family: 'DM Mono', monospace; margin-top: 3px;
}

.brand-tabs {
  display: flex; gap: 0;
  background: var(--surface);
  border-bottom: 2px solid var(--border);
  padding: 0 28px;
}
.brand-tab {
  padding: 11px 24px; cursor: pointer;
  font-size: 12px; font-weight: 600;
  color: var(--muted); border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  transition: all 0.18s; white-space: nowrap;
  letter-spacing: 0.4px; text-transform: uppercase;
}
.brand-tab:hover { color: var(--text); }
.brand-tab[data-brand="sangria"].active      { color: var(--sangria-accent); border-color: var(--sangria-accent); }
.brand-tab[data-brand="hop"].active          { color: var(--hop-accent);     border-color: var(--hop-accent); }
.brand-tab[data-brand="aay"].active          { color: var(--aay-accent);     border-color: var(--aay-accent); }
.brand-tab[data-brand="anouk_rustic"].active { color: var(--ar-accent);      border-color: var(--ar-accent); }

.brand-content { display: none; padding: 22px 28px 40px; }
.brand-content.active { display: block; }

.kpi-strip {
  display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  margin-bottom: 22px;
}
.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
}
.kpi-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 5px; }
.kpi-value { font-family: 'DM Mono', monospace; font-size: 21px; font-weight: 500; line-height: 1; color: var(--text); }
.kpi-sub   { color: var(--muted); font-size: 10px; margin-top: 4px; font-family: 'DM Mono', monospace; }

.tier-subtabs {
  display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap;
}
.tier-subtab {
  padding: 6px 14px; border-radius: 20px; cursor: pointer;
  font-size: 11px; font-weight: 600; letter-spacing: 0.4px;
  border: 1.5px solid; transition: all 0.15s;
  background: transparent;
}
.tier-subtab[data-tier="All"]        { border-color: #94a3b8; color: #475569; }
.tier-subtab[data-tier="Very Fast"]  { border-color: var(--vf-color); color: var(--vf-color); }
.tier-subtab[data-tier="Fast"]       { border-color: var(--f-color);  color: var(--f-color); }
.tier-subtab[data-tier="Moderate"]   { border-color: var(--m-color);  color: var(--m-color); }
.tier-subtab[data-tier="Slow"]       { border-color: var(--s-color);  color: var(--s-color); }
.tier-subtab[data-tier="Dead"]       { border-color: var(--d-color);  color: var(--d-color); }

.tier-subtab[data-tier="All"].active        { background: #475569;         color: #fff; border-color: #475569; }
.tier-subtab[data-tier="Very Fast"].active  { background: var(--vf-color); color: #fff; }
.tier-subtab[data-tier="Fast"].active       { background: var(--f-color);  color: #fff; }
.tier-subtab[data-tier="Moderate"].active   { background: var(--m-color);  color: #fff; }
.tier-subtab[data-tier="Slow"].active       { background: var(--s-color);  color: #fff; }
.tier-subtab[data-tier="Dead"].active       { background: var(--d-color);  color: #fff; }

.tier-subtab .badge {
  display: inline-block; margin-left: 5px;
  background: rgba(0,0,0,0.12); border-radius: 8px;
  padding: 0 5px; font-size: 10px; font-family: 'DM Mono', monospace;
  line-height: 16px;
}
.tier-subtab.active .badge { background: rgba(255,255,255,0.25); }

.table-toolbar {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.search-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 7px 11px;
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 12px;
  width: 300px; outline: none; transition: border-color 0.2s;
}
.search-box::placeholder { color: var(--muted); }
.search-box:focus { border-color: #94a3b8; }
.result-count { color: var(--muted); font-size: 11px; font-family: 'DM Mono', monospace; }

.table-wrap {
  overflow-x: auto; border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
}
table { width: 100%; border-collapse: collapse; font-size: 12px; }

thead th {
  background: var(--surface2);
  padding: 9px 11px; text-align: left;
  color: var(--muted); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.6px;
  font-weight: 600; white-space: nowrap;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 1;
}
th.num, td.num { text-align: right; }

tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #f9f8f6; }
tbody td { padding: 8px 11px; vertical-align: middle; }

.style-link {
  font-family: 'DM Mono', monospace; font-size: 11.5px;
  color: #2563eb; text-decoration: none; transition: color 0.15s;
}
.style-link:hover { color: #1d4ed8; text-decoration: underline; }

.mono { font-family: 'DM Mono', monospace; font-size: 11.5px; }
.sku-text { font-family: 'DM Mono', monospace; font-size: 10.5px; color: #78716c; }
.wc-val { font-family: 'DM Mono', monospace; font-size: 11.5px; color: #b45309; font-weight: 500; }
.wc-na  { color: #cbd5e1; font-size: 11px; }

.doh-val { font-family: 'DM Mono', monospace; font-size: 11.5px; }
.doh-ok   { color: #0f766e; }
.doh-warn { color: #b45309; }
.doh-high { color: #9f1239; }
.doh-na   { color: #cbd5e1; font-size: 11px; }

.tier-pill {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.3px;
}
.tier-pill.vf { background: #ede9fe; color: var(--vf-color); }
.tier-pill.f  { background: #e0f2fe; color: var(--f-color); }
.tier-pill.m  { background: #ccfbf1; color: var(--m-color); }
.tier-pill.s  { background: #fef3c7; color: var(--s-color); }
.tier-pill.d  { background: #ffe4e6; color: var(--d-color); }

.stock-btn {
  font-family: 'DM Mono', monospace; font-size: 11.5px;
  color: var(--ar-accent); cursor: pointer; background: none; border: none;
  text-decoration: underline dotted; padding: 0; font-weight: 500;
  transition: opacity 0.15s;
}
.stock-btn:hover { opacity: 0.65; }
.stock-btn.open::after { content: " ▲"; font-size: 8px; }
.stock-btn:not(.open)::after { content: " ▼"; font-size: 8px; }

.sku-row { display: none; }
.sku-row.open { display: table-row; }
.sku-cell { background: #fdf8f4 !important; padding: 0 !important; }
.sku-inner-wrap { padding: 8px 12px 10px 36px; }
.sku-inner { width: 100%; border-collapse: collapse; font-size: 11px; }
.sku-inner th {
  color: var(--muted); font-size: 9.5px; text-transform: uppercase;
  padding: 4px 8px; text-align: left; font-weight: 600;
  border-bottom: 1px solid var(--border); background: transparent; position: static;
}
.sku-inner th.num { text-align: right; }
.sku-inner td { padding: 4px 8px; color: #57534e; border-bottom: 1px solid #f0ebe4; }
.sku-inner td.num { text-align: right; }
.sku-inner tr:last-child td { border-bottom: none; }
.sku-code { font-family: 'DM Mono', monospace; font-size: 10.5px; color: #78716c; }

.no-results { color: var(--muted); font-size: 12px; padding: 20px; text-align: center; font-style: italic; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>

al": 0}], "ros": 0.27, "tier": "Slow", "doh": 340.7}]};

const TIERS       = ['Very Fast','Fast','Moderate','Slow','Dead'];
const TIER_KEY    = {'Very Fast':'vf','Fast':'f','Moderate':'m','Slow':'s','Dead':'d'};
const TIER_LABELS = ['All','Very Fast','Fast','Moderate','Slow','Dead'];
const BRAND_ACCENT = { sangria:'var(--sangria-accent)', hop:'var(--hop-accent)', aay:'var(--aay-accent)', anouk_rustic:'var(--ar-accent)' };

const brandState  = { sangria:'All', hop:'All', aay:'All', anouk_rustic:'All' };
const brandSearch = { sangria:'',    hop:'',    aay:'',    anouk_rustic:'' };

function fmtIN(n) {
  if (n === undefined || n === null) return '—';
  n = Math.round(n);
  if (n === 0) return '0';
  const neg = n < 0; n = Math.abs(n);
  const s = n.toString();
  const last3 = s.slice(-3);
  const rest  = s.slice(0,-3);
  const r = rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g,',') + ',' + last3 : last3;
  return (neg?'-':'') + r;
}

function fmtWC(cost, stock) {
  const wc = cost * stock;
  if (wc === 0) return '<span class="wc-na">—</span>';
  if (wc >= 1e7) return `<span class="wc-val">₹${(wc/1e7).toFixed(2)} Cr</span>`;
  if (wc >= 1e5) return `<span class="wc-val">₹${(wc/1e5).toFixed(1)} L</span>`;
  return `<span class="wc-val">₹${fmtIN(wc)}</span>`;
}

function fmtDOH(doh) {
  if (doh === null || doh === undefined) return '<span class="doh-na">—</span>';
  const d = Math.round(doh);
  let cls = d <= 60 ? 'doh-ok' : d <= 120 ? 'doh-warn' : 'doh-high';
  return `<span class="doh-val ${cls}">${fmtIN(d)}</span>`;
}

function tierPill(tier) {
  return `<span class="tier-pill ${TIER_KEY[tier]||''}">${tier}</span>`;
}

function buildKPIs(items, brand) {
  const accent    = BRAND_ACCENT[brand];
  const totalStyles = items.length;
  const totalStock  = items.reduce((s,x)=>s+x.stock,0);
  const totalSales  = items.reduce((s,x)=>s+x.total,0);
  const wcBlocked   = items.filter(x=>x.tier!=='Very Fast'&&x.tier!=='Fast').reduce((s,x)=>s+x.stock*x.cost,0);
  const avgROS      = (items.reduce((s,x)=>s+x.ros,0)/items.length).toFixed(3);
  const vfCount     = items.filter(x=>x.tier==='Very Fast').length;
  const deadCount   = items.filter(x=>x.tier==='Dead').length;
  function wcFmt(wc) {
    if (wc>=1e7) return `₹${(wc/1e7).toFixed(2)} Cr`;
    if (wc>=1e5) return `₹${(wc/1e5).toFixed(1)} L`;
    return `₹${fmtIN(wc)}`;
  }
  return `<div class="kpi-strip">
    <div class="kpi">
      <div class="kpi-label">Total Styles</div>
      <div class="kpi-value" style="color:${accent}">${fmtIN(totalStyles)}</div>
      <div class="kpi-sub">${vfCount} Very Fast · ${deadCount} Dead</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Total Stock</div>
      <div class="kpi-value">${fmtIN(totalStock)}</div>
      <div class="kpi-sub">units on hand</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Total Sales</div>
      <div class="kpi-value">${fmtIN(totalSales)}</div>
      <div class="kpi-sub">Feb–Apr 2026</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Blocked Capital</div>
      <div class="kpi-value" style="color:#b45309;font-size:17px">${wcFmt(wcBlocked)}</div>
      <div class="kpi-sub">Moderate · Slow · Dead</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Avg ROS</div>
      <div class="kpi-value">${avgROS}</div>
      <div class="kpi-sub">units / day</div>
    </div>
  </div>`;
}

function buildSubtabs(items, brand) {
  const counts = {All: items.length};
  for (const t of TIERS) counts[t] = items.filter(x=>x.tier===t).length;
  const active = brandState[brand];
  return `<div class="tier-subtabs" id="subtabs-${brand}">` +
    TIER_LABELS.map(t =>
      `<div class="tier-subtab ${t===active?'active':''}" data-tier="${t}"
            onclick="switchTier('${brand}','${t}')">${t}<span class="badge">${counts[t]}</span></div>`
    ).join('') + `</div>`;
}

function buildRow(item, isAR) {
  const link = `https://www.myntra.com/${item.style_id}`;
  const wc   = (item.tier==='Very Fast'||item.tier==='Fast') ? '<span class="wc-na">—</span>' : fmtWC(item.cost, item.stock);
  const skuDisplay = `<span class="sku-text">${item.sku}</span>`;

  if (!isAR) {
    return `<tr>
      <td><a href="${link}" target="_blank" class="style-link">${item.style_id}</a></td>
      <td>${skuDisplay}</td>
      <td>${item.article_type}</td>
      <td class="num mono">${fmtIN(item.stock)}</td>
      <td class="num">${fmtDOH(item.doh)}</td>
      <td class="num mono">${fmtIN(item.feb)}</td>
      <td class="num mono">${fmtIN(item.mar)}</td>
      <td class="num mono">${fmtIN(item.apr)}</td>
      <td class="num mono">${fmtIN(item.total)}</td>
      <td class="num mono">${item.ros.toFixed(3)}</td>
      <td class="num">${wc}</td>
      <td>${tierPill(item.tier)}</td>
    </tr>`;
  } else {
    const skuRows = item.skus.map(s=>`<tr>
      <td class="sku-code">${s.sku}</td>
      <td class="num">${fmtIN(s.stock)}</td>
      <td class="num">${fmtIN(s.feb)}</td>
      <td class="num">${fmtIN(s.mar)}</td>
      <td class="num">${fmtIN(s.apr)}</td>
      <td class="num">${fmtIN(s.total)}</td>
    </tr>`).join('');
    const skuBlock = `<div class="sku-inner-wrap"><table class="sku-inner">
      <thead><tr><th>SKU</th><th class="num">Stock</th><th class="num">Feb</th><th class="num">Mar</th><th class="num">Apr</th><th class="num">Total</th></tr></thead>
      <tbody>${skuRows}</tbody>
    </table></div>`;
    const rowId = `sku-${item.style_id}`;
    return `<tr class="ar-main" data-style="${item.style_id}">
      <td><a href="${link}" target="_blank" class="style-link">${item.style_id}</a></td>
      <td>${skuDisplay}</td>
      <td>${item.article_type}</td>
      <td class="num">
        <button class="stock-btn" id="btn-${item.style_id}" onclick="toggleSKU('${rowId}','btn-${item.style_id}')">${fmtIN(item.stock)}</button>
      </td>
      <td class="num">${fmtDOH(item.doh)}</td>
      <td class="num mono">${fmtIN(item.feb)}</td>
      <td class="num mono">${fmtIN(item.mar)}</td>
      <td class="num mono">${fmtIN(item.apr)}</td>
      <td class="num mono">${fmtIN(item.total)}</td>
      <td class="num mono">${item.ros.toFixed(3)}</td>
      <td class="num">${wc}</td>
      <td>${tierPill(item.tier)}</td>
    </tr>
    <tr class="sku-row" id="${rowId}"><td colspan="12" class="sku-cell">${skuBlock}</td></tr>`;
  }
}

function renderTable(brand) {
  const items  = RAW[brand];
  const isAR   = brand === 'anouk_rustic';
  const active = brandState[brand];
  const q      = brandSearch[brand].toLowerCase();

  let filtered = active === 'All' ? [...items] : items.filter(x=>x.tier===active);
  filtered.sort((a,b)=>b.ros-a.ros);
  if (q) filtered = filtered.filter(x =>
    String(x.style_id).includes(q) ||
    x.article_type.toLowerCase().includes(q) ||
    x.sku.toLowerCase().includes(q)
  );

  const rows = filtered.map(x=>buildRow(x,isAR)).join('');
  const colSpan = isAR ? 12 : 12;

  return `<div class="table-toolbar">
    <input class="search-box" id="srch-${brand}" placeholder="Search Style ID, SKU or Article Type…"
           value="${brandSearch[brand]}" oninput="onSearch('${brand}', this.value)">
    <span class="result-count" id="cnt-${brand}">${filtered.length} style${filtered.length!==1?'s':''}</span>
  </div>
  <div class="table-wrap">
    <table id="tbl-${brand}">
      <thead><tr>
        <th>Style ID</th>
        <th>SKU</th>
        <th>Article Type</th>
        <th class="num">Stock</th>
        <th class="num">Days on Hand</th>
        <th class="num">Feb</th>
        <th class="num">Mar</th>
        <th class="num">Apr</th>
        <th class="num">Total Sales</th>
        <th class="num">ROS</th>
        <th class="num">Working Capital</th>
        <th>Tier</th>
      </tr></thead>
      <tbody>${rows || `<tr><td colspan="${colSpan}" class="no-results">No styles match this filter</td></tr>`}</tbody>
    </table>
  </div>`;
}

function renderBrand(brand) {
  const items = RAW[brand];
  document.getElementById(`tab-${brand}`).innerHTML =
    buildKPIs(items, brand) +
    buildSubtabs(items, brand) +
    `<div id="table-area-${brand}">` + renderTable(brand) + `</div>`;
}

function refreshTableArea(brand) {
  document.getElementById(`table-area-${brand}`).innerHTML = renderTable(brand);
  document.querySelectorAll(`#subtabs-${brand} .tier-subtab`).forEach(t => {
    t.classList.toggle('active', t.dataset.tier === brandState[brand]);
  });
  const s = document.getElementById(`srch-${brand}`);
  if (s) { s.focus(); const len = s.value.length; s.setSelectionRange(len,len); }
}

function switchBrand(brand) {
  document.querySelectorAll('.brand-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.brand-content').forEach(c=>c.classList.remove('active'));
  document.querySelector(`.brand-tab[data-brand="${brand}"]`).classList.add('active');
  document.getElementById(`tab-${brand}`).classList.add('active');
}

function switchTier(brand, tier) {
  brandState[brand] = tier;
  refreshTableArea(brand);
}

function onSearch(brand, val) {
  brandSearch[brand] = val;
  refreshTableArea(brand);
}

function toggleSKU(rowId, btnId) {
  const row = document.getElementById(rowId);
  const btn = document.getElementById(btnId);
  if (!row) return;
  const open = row.classList.toggle('open');
  if (btn) btn.classList.toggle('open', open);
}

['sangria','hop','aay','anouk_rustic'].forEach(renderBrand);
</script>
